# arguments for dataset
dataset: bijie
nclass: 2
crop_size: 518
data_root: Bijie

# arguments for training
epochs: 50
batch_size: 4 # per GPU x 4 GPUs
lr: 0.000005
lr_multi: 40.0
criterion:
  name: CELoss
  kwargs:
    ignore_index: 255
conf_thresh: 0.95

model: dpt
backbone: dinov2_base
lock_backbone: False
sam_purity_thresh: 0.60      
